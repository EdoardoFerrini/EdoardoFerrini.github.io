configuration:
  pageTitle: Doxa
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: false
  analytics: null
  locale: en-US
  baseUrl: edoardoferrini.github.io
  ignorePatterns: [private, templates, .obsidian]
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Geist
      body: JetBrains Mono
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: '@quartz-community/note-properties'
    enabled: true
    options: { hidePropertiesView: true }
    order: 0
  - source: '@quartz-community/created-modified-date'
    enabled: true
    options:
      defaultDateType: published
      priority: [frontmatter, git, filesystem]
    order: 10
  - source: '@quartz-community/syntax-highlighting'
    enabled: true
    options:
      theme: { light: github-light, dark: github-dark }
      keepBackground: false
    order: 20
  - source: '@quartz-community/obsidian-flavored-markdown'
    enabled: true
    options: { enableInHtmlEmbed: false }
    order: 30
  - source: '@quartz-community/github-flavored-markdown'
    enabled: true
    order: 40
  - source: '@quartz-community/crawl-links'
    enabled: true
    options: { markdownLinkResolution: shortest }
    order: 60
  - source: '@quartz-community/description'
    enabled: true
    order: 70
  - source: '@quartz-community/latex'
    enabled: true
    options: { renderEngine: katex }
    order: 80
  - source: '@quartz-community/unlisted-pages'
    enabled: true
  - source: '@quartz-community/remove-draft'
    enabled: true
  - source: '@quartz-community/alias-redirects'
    enabled: true
  - source: '@quartz-community/content-index'
    enabled: true
    options: { enableSiteMap: true, enableRSS: true, rssFullHtml: true, rssLimit: 50 }
  - source: '@quartz-community/favicon'
    enabled: true
  - source: '@quartz-community/content-page'
    enabled: true
  - source: '@quartz-community/folder-page'
    enabled: false
  - source: '@quartz-community/article-title'
    enabled: true
    layout: { position: beforeBody, priority: 10, condition: not-index }
  - source: '@quartz-community/comments'
    enabled: true
    options:
      provider: giscus
      options:
        repo: dlarsen5/blog-host-trial-quartz
        repoId: R_kgDOVjHCLA
        category: Announcements
        categoryId: DIC_kwDOVjHCLM4DKZP0
        mapping: pathname
        lightTheme: solar-day
        darkTheme: solar-night
    layout: { position: afterBody, priority: 10, condition: post }
